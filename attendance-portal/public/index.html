<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Attendance Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f7f4; --card:#ffffff; --ink:#1d2a26; --muted:#5d6b66;
    --line:#d5ddd8; --green:#1f6f55; --green-dark:#154d3c;
    --amber:#b7791f; --red:#b3372f; --focus:#2b6cb0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Public Sans",system-ui,sans-serif}
  header{background:var(--green-dark);color:#fff;padding:28px 20px}
  header div,main{max-width:1000px;margin:0 auto}
  h1{font:700 1.9rem/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
  header p{margin:0;opacity:.85}
  main{padding:24px 20px 60px;display:grid;gap:24px}
  section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
  h2{font:700 1.2rem "Bricolage Grotesque",sans-serif;margin:0 0 14px}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
  label{display:grid;gap:4px;font-weight:500;font-size:.9rem}
  input{padding:9px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
  :focus-visible{outline:3px solid var(--focus);outline-offset:1px}
  button{font:600 .95rem "Public Sans",sans-serif;padding:9px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer}
  .primary{background:var(--green);color:#fff}.primary:hover{background:var(--green-dark)}
  .ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .edit{background:#fff7e6;border-color:#f0d9a8;color:#7a4f0c}
  .del{background:#fdeceb;border-color:#f1c2be;color:var(--red)}
  .tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
  .tools input{min-width:240px}
  .wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{font-size:.85rem;color:var(--muted);font-weight:600}
  td.act{display:flex;gap:6px}
  .empty{padding:24px;text-align:center;color:var(--muted)}
  #toast{position:fixed;right:16px;bottom:16px;padding:12px 16px;border-radius:6px;color:#fff;
    background:var(--green);display:none;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  #toast.error{background:var(--red)}
  @media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
</style>
</head>
<body>
<header><div>
  <h1>Lab Attendance Portal</h1>
  <p>Add, review, correct and remove attendance records.</p>
</div></header>

<main>
  <section aria-labelledby="formTitle">
    <h2 id="formTitle">Add attendance record</h2>
    <form id="form">
      <input type="hidden" id="recordId">
      <label>Date <input type="date" id="date" required></label>
      <label>Subject name <input id="subject" required maxlength="100" placeholder="e.g. Database Systems"></label>
      <label>Section <input id="section" required maxlength="100" placeholder="e.g. BSIT-3A"></label>
      <label>Student name <input id="studentName" required maxlength="100" placeholder="e.g. Juan Dela Cruz"></label>
      <div style="display:flex;gap:8px">
        <button class="primary" id="saveBtn" type="submit">Add record</button>
        <button class="ghost" id="cancelBtn" type="button" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section aria-labelledby="listTitle">
    <h2 id="listTitle">Attendance records <span id="count" style="font-weight:400;color:var(--muted)"></span></h2>
    <div class="tools">
      <input type="search" id="search" placeholder="Filter by student, subject or section" aria-label="Filter records">
      <button class="ghost" id="refresh" type="button">Refresh</button>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>Date</th><th>Subject</th><th>Section</th><th>Student</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No records yet. Add the first one above.</div>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const API = "/api/attendance";
const $ = id => document.getElementById(id);
let records = [];

function toast(msg, isError){
  const t = $("toast"); t.textContent = msg; t.className = isError ? "error" : "";
  t.style.display = "block"; clearTimeout(toast.t);
  toast.t = setTimeout(()=> t.style.display = "none", 3500);
}

async function api(url, opts){
  const res = await fetch(url, opts);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const q = $("search").value.toLowerCase();
  const list = records.filter(r => [r.studentName,r.subject,r.section,r.date].join(" ").toLowerCase().includes(q));
  $("count").textContent = `(${list.length})`;
  $("empty").hidden = list.length > 0;
  $("rows").innerHTML = list.map(r => `
    <tr>
      <td>${esc(r.date)}</td><td>${esc(r.subject)}</td><td>${esc(r.section)}</td><td>${esc(r.studentName)}</td>
      <td class="act">
        <button class="edit" data-edit="${r._id}">Edit</button>
        <button class="del" data-del="${r._id}">Delete</button>
      </td>
    </tr>`).join("");
}

async function load(){
  try { records = await api(API); render(); }
  catch(e){ toast("Could not load records: " + e.message, true); }
}

function resetForm(){
  $("form").reset(); $("recordId").value = "";
  $("formTitle").textContent = "Add attendance record";
  $("saveBtn").textContent = "Add record"; $("cancelBtn").hidden = true;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const id = $("recordId").value;
  const body = JSON.stringify({
    date: $("date").value, subject: $("subject").value,
    section: $("section").value, studentName: $("studentName").value
  });
  try {
    await api(id ? `${API}/${id}` : API, {
      method: id ? "PUT" : "POST",
      headers: {"Content-Type":"application/json"}, body
    });
    toast(id ? "Record updated." : "Record added.");
    resetForm(); load();
  } catch(err){ toast(err.message, true); }
});

$("rows").addEventListener("click", async e => {
  const editId = e.target.dataset.edit, delId = e.target.dataset.del;
  if(editId){
    const r = records.find(x => x._id === editId);
    $("recordId").value = r._id; $("date").value = r.date; $("subject").value = r.subject;
    $("section").value = r.section; $("studentName").value = r.studentName;
    $("formTitle").textContent = "Edit attendance record";
    $("saveBtn").textContent = "Save changes"; $("cancelBtn").hidden = false;
    $("form").scrollIntoView({behavior:"smooth"}); $("studentName").focus();
  }
  if(delId){
    const r = records.find(x => x._id === delId);
    if(!confirm(`Delete the record for ${r.studentName} (${r.subject}, ${r.date})? This cannot be undone.`)) return;
    try { await api(`${API}/${delId}`, {method:"DELETE"}); toast("Record deleted."); load(); }
    catch(err){ toast(err.message, true); }
  }
});

$("cancelBtn").addEventListener("click", resetForm);
$("search").addEventListener("input", render);
$("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
